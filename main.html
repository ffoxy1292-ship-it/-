<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> - 💚حملة تشجير الجزائر</title>
    <link rel="stylesheet" href="css/style.css">
    
    <link rel="stylesheet" href="flower-styles.css">
    <style>
        
        #welcome-flower {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 9999;
            background: #000; 
        }
        
        .main-content {
            display: none; 
        }
        
        body.flower-loaded .main-content {
            display: block; 
        }
        
        body.flower-loaded #welcome-flower {
            display: none; /* Hide flower after delay */
        }
    </style>
</head>
<body class="not-loaded">
    <!-- ADD FLOWER WELCOME SCREEN -->
    <div id="welcome-flower">
        <div class="night"></div>
        <div class="flowers">
            <!-- PASTE ALL YOUR FLOWER HTML CODE HERE -->
            <!-- Copy everything from <div class="flower flower--1"> to </div> -->
            <div class="flower flower--1">
                <div class="flower__leafs flower__leafs--1">
                <!-- ... ALL YOUR FLOWER CODE ... -->
                </div>
            </div>
            <!-- ... ALL THE REST OF FLOWER CODE ... -->
        </div>
    </div>

    <!-- YOUR ORIGINAL CONTENT - WRAP IN DIV -->
    <div class="main-content">
        <div class="conteudo__geral">
            <div class="container">
                <h1 class="main-title">🌿 خضرة بإذن الله</h1>
                <p class="subtitle">اختر المنطقة المناسبة</p>
                
                <div class="container-carrossel">
                    <div class="carrossel">
                        <a href="articles/sawahel.html" class="carrossel-item">
                            <div class="item-content">
                                <span class="icon">🏖️</span>
                                <h3>المناطق الساحلية</h3>
                                <p>أشجار تتحمل الملوحة</p>
                            </div>
                        </a>
                        
                        <a href="articles/dakhlya.html" class="carrossel-item">
                            <div class="item-content">
                                <span class="icon">🏞️</span>
                                <h3>المناطق الداخلية</h3>
                                <p>أشجار للتربة الداخلية</p>
                            </div>
                        </a>
                        
                        <a href="articles/sahra.html" class="carrossel-item">
                            <div class="item-content">
                                <span class="icon">🏜️</span>
                                <h3>المناطق الصحراوية</h3>
                                <p>أشجار تتحمل الجفاف</p>
                            </div>
                        </a>
                    </div>
                </div>
                
                <div class="controls">
                    <button class="prev-btn">‹</button>
                    <button class="next-btn">›</button>
                </div>
            </div>
        </div>

        <footer>
            <div class="footer-container">
                <p>- معًا نحو جزائر خضراء مستدامة</p>
                <p>© 2026 تصميم وإنتاج  M .Bn- جميع الحقوق محفوظة</p>
            </div>
        </footer>
    </div>

    <script src="js/script.js"></script>
    <!-- ADD FLOWER SCRIPT -->
    <script src="flower-script.js"></script>
    <script>
        // After flower animation completes, show main content
        setTimeout(() => {
            document.body.classList.remove('not-loaded');
            document.body.classList.add('flower-loaded');
        }, 5000); // 5 seconds - adjust as needed
    </script>
</body>
</html>
